# Railway Nixpacks: 한글 카드 렌더링용 Noto CJK 폰트 (telegram_single_card)
# https://nixpacks.com/docs/configuration/file

[phases.setup]
aptPkgs = ["fonts-noto-cjk", "fontconfig"]

[phases.build]
cmds = [
  "fc-cache -f -v || true",
  "python -c \"from card_backgrounds import generate_geopolitical,generate_tech,generate_commodity,generate_asia,generate_neutral; import os; os.makedirs('assets/fallbacks',exist_ok=True); pairs=[('market_01.jpg',generate_geopolitical),('market_02.jpg',generate_tech),('market_03.jpg',generate_commodity),('market_04.jpg',generate_asia),('market_05.jpg',generate_neutral),('default_market.jpg',generate_neutral)]; [p[1](1080,1350).save('assets/fallbacks/'+p[0],'JPEG',quality=88) for p in pairs]\" || true",
]
